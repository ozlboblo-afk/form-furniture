<!doctype html>
<html lang="ja">
  <head>
    <!-- ==== Basic ==== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==== SEO ==== -->
    <title>FORM｜FURNITURE</title>
    <meta
      name="description"
      content="FORM / FURNITUREは、暮らしに寄り添う家具を提案する家具ブランドです。素材やかたちにこだわった家具を通して、心地よい空間をつくります。"
    />
    <link rel="canonical" href="https://form-furniture-ivory.vercel.app/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- ==== OGP ==== -->
    <meta property="og:site_name" content="FORM｜FURNITURE" />
    <meta property="og:title" content="FORM｜FURNITURE" />
    <meta
      property="og:description"
      content="FORM / FURNITUREは、暮らしに寄り添う家具を提案する家具ブランドです。素材やかたちにこだわった家具を通して、心地よい空間をつくります。"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://form-furniture-ivory.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://form-furniture-ivory.vercel.app/assets/ogp/ogp.png"
    />
    <meta property="og:locale" content="ja_JP" />

    <!-- ==== Icons ==== -->
    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />

    <!-- ==== CSS ==== -->
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>

  <body>
    <header class="header">
      <a href="/index.html" class="logo">FORM / FURNITURE</a>

      <button
        class="drawerButton"
        aria-label="メニュー"
        aria-expanded="false"
        aria-controls="headerMenu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="headerNav" id="headerMenu">
        <ul class="headerNavList">
          <li>
            <a href="/about.html">ABOUT</a>
          </li>

          <li>
            <a href="/product.html">PRODUCT</a>
          </li>

          <li>
            <a href="/contact.html">CONTACT</a>
          </li>
        </ul>
      </nav>
    </header>

    <div class="drawerOverlay"></div>

    <main>
      <section class="hero">
        <div class="heroImg visual">
          <img src="/assets/img/hero.webp" alt="" />
        </div>

        <h1 class="heroTitle">
          Furniture
          <br />
          for
          <br />
          Good Days.
        </h1>
      </section>

      <section class="productCategory">
        <div class="sectionHeader">
          <h2>PRODUCT CATEGORY</h2>
        </div>

        <ul class="categoryList">
          <li>
            <a href="/product.html?category=chair" class="categoryCard visual">
              <img src="/assets/img/categoryChair.webp" alt="" />

              <div class="categoryInfo">
                <span class="categoryNumber">01</span>
                <span class="categoryName">CHAIR</span>
              </div>
            </a>
          </li>

          <li>
            <a href="/product.html?category=table" class="categoryCard visual">
              <img src="/assets/img/categoryTable.webp" alt="" />

              <div class="categoryInfo">
                <span class="categoryNumber">02</span>
                <span class="categoryName">TABLE</span>
              </div>
            </a>
          </li>

          <li>
            <a href="/product.html?category=sofa" class="categoryCard visual">
              <img src="/assets/img/categorySofa.webp" alt="" />

              <div class="categoryInfo">
                <span class="categoryNumber">03</span>
                <span class="categoryName">SOFA</span>
              </div>
            </a>
          </li>

          <li>
            <a
              href="/product.html?category=storage"
              class="categoryCard visual"
            >
              <img src="/assets/img/categoryStorage.webp" alt="" />

              <div class="categoryInfo">
                <span class="categoryNumber">04</span>
                <span class="categoryName">STORAGE</span>
              </div>
            </a>
          </li>
        </ul>
      </section>

      <section class="pickup">
        <div class="sectionHeader">
          <h2>PICK UP</h2>
        </div>

        <div class="pickupSlider">
          <div class="pickupList"></div>

          <div class="pickupNavigation">
            <button
              class="pickupArrow pickupPrev"
              type="button"
              aria-label="前の商品"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="M15 18 9 12l6-6" />
              </svg>
            </button>

            <div class="pickupDots"></div>

            <button
              class="pickupArrow pickupNext"
              type="button"
              aria-label="次の商品"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="contactCta">
        <div class="contactCtaContent">
          <h2 class="contactCtaLabel">CONTACT</h2>

          <p class="contactCtaTitle">
            Furniture for
            <br />
            everyday life.
          </p>

          <a href="/contact.html" class="textLink">CONTACT US</a>
        </div>

        <div class="contactImg visual">
          <img src="/assets/img/contact.webp" alt="" />
        </div>
      </section>
    </main>

    <footer class="footer">
      <nav class="footerNav">
        <ul class="footerNavList">
          <li>
            <a href="/about.html">ABOUT</a>
          </li>

          <li>
            <a href="/product.html">PRODUCT</a>
          </li>

          <li>
            <a href="/contact.html">CONTACT</a>
          </li>

          <li>
            <a href="/privacypolicy.html">PRIVACY POLICY</a>
          </li>

          <li>
            <a href="/legal.html">LEGAL</a>
          </li>
        </ul>
      </nav>

      <ul class="socialList">
        <li>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <img src="/assets/icon/instagram.svg" alt="" />
          </a>
        </li>

        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <img src="/assets/icon/facebook.svg" alt="" />
          </a>
        </li>
      </ul>

      <small class="copyright">© FORM / FURNITURE</small>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/index.js"></script>
  </body>
</html>
